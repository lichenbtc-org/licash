[package]
name = "licash-chain-client"
description = "Reads Bitcoin for Licash services: Bitcoin Core's JSON-RPC or an Esplora server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
licash.workspace = true
licash-onchain.workspace = true
anyhow.workspace = true
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
url = "2"

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
tempfile = "3.27"

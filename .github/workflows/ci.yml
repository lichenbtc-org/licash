name: ci
on:
  push:
  pull_request:
# The publishing jobs ask for more, for themselves only.
permissions:
  contents: read
# A newer push to a branch ends the run of an older one: its jobs are hours
# of runner time, and only the newest commit's result is read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Line tables only: full debug info for every test binary of the
    # workspace, then three images, filled the runner's disk (the linker
    # died of a bus error).
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Room on the disk, without the toolchains this job never uses
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      # Its members only: --all would follow path dependencies into
      # regtest's workspace.
      - working-directory: apps
        run: cargo fmt $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | "-p " + .name') -- --check
      - working-directory: apps
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - working-directory: apps
        run: cargo test --locked --workspace
      - name: Recovery driver challenge and collection
        working-directory: apps
        run: cargo test --release --locked -p licash-contracts --lib holder::recovery::driver_tests::a_retained_hub_receipt_answers_a_challenge_and_collects -- --ignored --exact
      - working-directory: apps
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Wallet image
        run: docker build -f apps/wallet-cli/Dockerfile .
      - name: Swaps image
        run: docker build -f apps/swaps/Dockerfile .
      - name: Observatory image
        run: docker build -f apps/observatory/Dockerfile .
      - name: Witness image
        run: docker build -f apps/witness/Dockerfile .
      - name: Bridge image
        run: docker build -f apps/bridge/Dockerfile .
  # The hub's prover (r0/host), its CPU build: the CUDA build is the hub
  # image's.
  r0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: r0/host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # regtest/: its tests export the inputs r0/host's run the pinned
          # program on.
          workspaces: |
            r0/host
            regtest
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release
  # The hub's image builds its prover's CUDA kernels, on a CUDA image: a
  # job of its own, for its time and its disk.
  hub-image:
    runs-on: ubuntu-latest
    # From nothing, the prover's build takes the best part of two hours:
    # once, until its dependencies change.
    timeout-minutes: 150
    steps:
      - name: Room on the disk, without the toolchains this job never uses
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The prover's build is over an hour from nothing: kept between runs,
      # and left for the images job below, which builds it again.
      - uses: ./.github/actions/prover-cache
      - run: docker build -f apps/hub/Dockerfile .
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile/chain
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/mobile/chain/go.mod
          cache-dependency-path: apps/mobile/chain/go.sum
      - name: Official neutrino at the pinned hash, with this repository's patches
        run: upstream/materialize.sh && upstream/materialize.sh --check
      - run: test -z "$(gofmt -l mempool node mobile)"
      - run: go vet ./... && go vet -tags regtest ./...
      - run: go test -race ./...
      - name: Light client, block-dn import and mempool against Bitcoin Core in regtest
        run: ./regtest.sh
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The core for two targets, then a debug and a release app, filled
      # the runner's disk.
      - name: Room on the disk, without the toolchains this job never uses
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/mobile/chain/go.mod
          cache-dependency-path: apps/mobile/chain/go.sum
      - name: Official neutrino, and gomobile at the version go.mod pins
        working-directory: apps/mobile/chain
        run: |
          upstream/materialize.sh
          version=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$version golang.org/x/mobile/cmd/gobind@$version
          gomobile init
      - name: Wallet core, its Kotlin bindings and the light client's AAR
        working-directory: apps/mobile/android
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME ./native.sh
      # Release unsigned: only publish-app holds the signing key.
      - name: App, and its unit tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned
          path: apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - name: Hubs, gateways and wallets on a regtest ecosystem
        run: apps/e2e/run.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: apps/target/e2e/
  app-e2e:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - uses: actions/download-artifact@v8
        with:
          name: app-debug
          path: ${{ runner.temp }}/app
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The app on an emulator, on the regtest ecosystem
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LICASH_E2E_APP: ${{ runner.temp }}/app/app-debug.apk
        with:
          api-level: 34
          arch: x86_64
          # The phone the test is written on: with no profile, a 320x640 dp
          # screen, too small for the buttons it taps without scrolling.
          profile: pixel_6
          disable-animations: true
          # As the test is run locally: typed through a hardware keyboard,
          # with no on-screen keyboard covering the buttons it taps.
          enable-hw-keyboard: true
          script: apps/e2e/run.sh the_app_is
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-logs
          path: apps/target/e2e/
  regtest:
    runs-on: ubuntu-latest
    # The contracts' openings garble and check real instances.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: licash
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: licash/regtest
      - working-directory: licash
        run: cargo fmt --manifest-path regtest/Cargo.toml -p licash-chain -p licash-contract -p licash-hp -p licash-statement -- --check
      - working-directory: licash
        run: cargo clippy --locked --manifest-path regtest/Cargo.toml --workspace --all-targets --no-deps -- -D warnings
      - name: The contract's opening messages
        working-directory: licash
        run: cargo test --release --locked --manifest-path regtest/Cargo.toml -p licash-chain -p licash-contract -p licash-hp -p licash-statement
      - name: Contracts on Bitcoin Core regtest (mock proofs)
        working-directory: licash
        run: regtest/run.sh

  # Publishing, from main only, once every job above passed: the services'
  # images to ghcr.io, the app to the main-build prerelease. Versioned
  # releases are left for later.

  # Each platform's images on a runner of its architecture where there is
  # one, pushed by digest only: images-tag names them.
  images:
    needs: [rust, apps, r0, hub-image, chain, android, e2e, app-e2e, regtest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          # GitHub's ARM runners have no -latest label: the newest Ubuntu.
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-26.04-arm
          # No runner is 32-bit ARM: cross-compiled (apps/image-build.sh).
          - platform: linux/arm/v7
            slug: armv7
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      PREFIX: ghcr.io/${{ github.repository_owner }}/licash-
    steps:
      # The hub's prover, on x86-64: a CUDA image to build on.
      - if: matrix.platform == 'linux/amd64'
        name: Room on the disk, without the toolchains this job never uses
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # For the runtime stage's few commands only: the binaries are
      # cross-compiled.
      - if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v4
        id: buildx
      # The prover's build, as hub-image left it.
      - if: matrix.platform == 'linux/amd64'
        uses: ./.github/actions/prover-cache
        with:
          builder: ${{ steps.buildx.outputs.name }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # One after another, on the builder's cache of the crates they share.
      - name: Hub, wallet, swaps, observatory and bridge images
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          for pair in hub:hub wallet:wallet-cli swaps:swaps observatory:observatory bridge:bridge; do
            image=${pair%%:*}
            docker buildx build --platform "$PLATFORM" --file "apps/${pair#*:}/Dockerfile" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --output "type=image,name=$PREFIX$image,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$RUNNER_TEMP/$image.json" .
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/$image.json")
            mkdir -p "$RUNNER_TEMP/digests/$image"
            touch "$RUNNER_TEMP/digests/$image/${digest#sha256:}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  # Each image's platforms under one name, tagged main and sha-<commit>.
  images-tag:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        image: [hub, wallet, swaps, observatory, bridge]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/licash-${{ matrix.image }}
      # On the index, where ghcr.io reads a multi-platform image's source.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
      - working-directory: ${{ runner.temp }}/digests/${{ matrix.image }}
        run: |
          mapfile -t args < <(jq -r '(.tags[] | "--tag=" + .), (.annotations[] | "--annotation=" + .)' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          digests=(*)
          docker buildx imagetools create "${args[@]}" "${digests[@]/#/$IMAGE@sha256:}"
          docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"

  # The app signed, on the main-build prerelease, replaced on each push.
  publish-app:
    needs: [rust, apps, r0, hub-image, chain, android, e2e, app-e2e, regtest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One replacement of the release at a time.
    concurrency:
      group: publish-app
    env:
      APK: licash-main.apk
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-release-unsigned
          path: ${{ runner.temp }}/app
      - name: Sign
        working-directory: ${{ runner.temp }}/app
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::No signing key: set the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets (docs/android.md)."
            exit 1
          fi
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n1)
          base64 -d <<<"$ANDROID_KEYSTORE" > "$RUNNER_TEMP/release.p12"
          "$tools/zipalign" -f -P 16 4 app-release-unsigned.apk aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$APK" aligned.apk
          rm "$RUNNER_TEMP/release.p12"
          "$tools/apksigner" verify --print-certs "$APK"
          sha256sum "$APK" > SHA256SUMS
      - name: Release
        working-directory: ${{ runner.temp }}/app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Replace the assets of the release in place, so the download link
          # never 404s between a delete and a create.
          notes="Built from $GITHUB_SHA on main, once CI passed. Replaced on each push to main."
          if gh release view main-build >/dev/null 2>&1; then
            gh release upload main-build "$APK" SHA256SUMS --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/main-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit main-build --notes "$notes"
          else
            gh release create main-build --prerelease --target "$GITHUB_SHA" --title "main (rolling)" \
              --notes "$notes" "$APK" SHA256SUMS
          fi

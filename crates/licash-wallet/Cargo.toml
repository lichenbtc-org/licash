[package]
name = "licash-wallet"
description = "Licash wallet: the notes an owner holds at its hubs, and the payments it makes and takes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
licash = { path = "../licash" }
licash-api = { path = "../licash-api" }
licash-onchain = { path = "../licash-onchain" }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
licash-store = { path = "../licash-store" }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
k256.workspace = true
lightning-invoice = { version = "0.34", features = ["std"] }
thiserror.workspace = true
tracing = "0.1"
rand_core.workspace = true
chacha20poly1305 = "0.10"
tokio = { version = "1.54", features = ["sync", "time"] }

[dev-dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
licash-hub = { path = "../licash-hub" }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt", "test-util"] }

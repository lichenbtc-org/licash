[package]
name = "licash-hub-service"
description = "The Licash hub service: the hub engine behind its HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-hub"
path = "src/main.rs"

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-chain-client.workspace = true
licash-dashboard.workspace = true
licash-contracts = { path = "../contracts" }
licash-witness = { path = "../witness" }
licash-hub.workspace = true
licash-lightning.workspace = true
licash-nostr = { workspace = true, features = ["tor"] }
licash-notify.workspace = true
licash-onchain.workspace = true
licash-store.workspace = true
licash-swaps.workspace = true
licash-swaps-service = { path = "../swaps" }
licash-tor.workspace = true
licash-transport = { workspace = true, features = ["tor"] }
licash-wallet.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "secp-recovery"] }
clap.workspace = true
hex = "0.4"
ipnet = "2"
lightning-invoice = { version = "0.34", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# An in-memory Lightning node, for tests.
fake = ["licash-lightning/fake"]

[dev-dependencies]
bitcoincore-rpc = "0.19"
licash-dashboard = { workspace = true, features = ["test-support"] }
licash-hub-service = { path = ".", features = ["fake"] }
licash-bridge = { path = "../bridge" }
licash-contracts = { path = "../contracts", features = ["faults"] }
licash-contract = { path = "../../crates/licash-contract" }
lichen-btc = { git = "https://github.com/lichenbtc-org/lichen-btc", rev = "d7d2de04f7f8d51b44f61a68c7e1789f36502071" }
nostr-sdk = { version = "0.45.6", features = ["local-relay"] }
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# The guests' host: packs ELFs with the zkOS kernel, executes inputs (cycle
# counts), proves them (succinct, wrapped in Groth16) and verifies receipts.
# A workspace of its own: the prover is heavy.
[package]
name = "licash-r0"
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace]
resolver = "3"

# The GPU build, `licash-r0-cuda` (CUDA's nvcc to build, its driver to run).
[features]
cuda = ["risc0-zkvm/cuda", "dep:risc0-zkp", "risc0-zkp/cuda"]

[dependencies]
licash = { path = "../../crates/licash" }
licash-chain = { path = "../../crates/licash-chain" }
licash-hp = { path = "../../crates/licash-hp" }
licash-statement = { path = "../../crates/licash-statement" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["prove", "std"] }
risc0-binfmt = "=3.0.6"
risc0-groth16 = { version = "=3.0.6", features = ["prove"] }
risc0-zkp = { version = "=3.0.6", optional = true }
risc0-zkos-v1compat = "=2.2.3"
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde_json = "1"
tempfile = "3"
# Signals: a worker's process group stopped, and this process with its
# parent.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[profile.release]
debug = 1

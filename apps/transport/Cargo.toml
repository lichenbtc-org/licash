[package]
name = "licash-transport"
description = "How Licash applications reach hubs and swap providers: HTTP(S), directly or through a proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
licash-wallet.workspace = true
anyhow.workspace = true
tracing.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
tokio = { workspace = true, features = ["rt"] }
licash-tor = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

[features]
# Reach hubs and providers through a Tor client of the application's own.
tor = ["dep:futures-util", "dep:licash-tor"]

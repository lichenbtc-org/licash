[package]
name = "licash-contracts"
description = "Opens Licash recovery contracts over HTTP: the holder's side in a wallet, the hub's in its service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-chain-client = { workspace = true, optional = true }
licash-chain = { path = "../../crates/licash-chain" }
licash-contract = { path = "../../crates/licash-contract" }
licash-hp = { path = "../../crates/licash-hp" }
licash-onchain.workspace = true
licash-statement = { path = "../../crates/licash-statement" }
lichen-babe = { git = "https://github.com/lichenbtc-org/lichen", rev = "0ed3fa09cd30827d35bb303cb5c7e68bd265a20f" }
lichen-contract = { git = "https://github.com/lichenbtc-org/lichen", rev = "0ed3fa09cd30827d35bb303cb5c7e68bd265a20f" }
lichen-btc = { git = "https://github.com/lichenbtc-org/lichen-btc", rev = "d7d2de04f7f8d51b44f61a68c7e1789f36502071" }
licash-store.workspace = true
licash-wallet.workspace = true
licash-witness = { path = "../witness", optional = true }
anyhow.workspace = true
ark-bn254 = "0.5"
ark-groth16 = { version = "0.5", default-features = false, features = ["std"] }
axum = { workspace = true, optional = true }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = { version = "0.4", features = ["serde"] }
hex-literal = "0.4"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", optional = true }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "std"], optional = true }

[features]
# The hub's side, and a node or an Esplora API as the holder's chain.
default = ["node"]
node = ["dep:axum", "dep:licash-chain-client", "dep:licash-witness", "dep:sha2", "dep:rustix"]
# A contract kept without opening one, for tests of what it holds a wallet to.
testing = []
# A dishonest hub's behaviors, and a dishonest holder's, for tests.
faults = ["node"]

[dev-dependencies]
k256 = "0.13"
licash-statement = { path = "../../crates/licash-statement", features = ["testing"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

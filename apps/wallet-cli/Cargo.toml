[package]
name = "licash-wallet-cli"
description = "The Licash wallet on the command line"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-wallet"
path = "src/main.rs"

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-wallet.workspace = true
licash-chain-client.workspace = true
licash-contracts = { path = "../contracts" }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
licash-nostr = { workspace = true, features = ["tor", "wallet"] }
licash-tor.workspace = true
licash-transport = { workspace = true, features = ["tor"] }
anyhow.workspace = true
clap.workspace = true
hex = "0.4"
jiff = "0.2"
qrcode = { version = "0.14", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
licash-bridge = { path = "../bridge" }
licash-contracts = { path = "../contracts", features = ["testing"] }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
licash-hub.workspace = true
licash-onchain.workspace = true
licash-hub-service = { path = "../hub" }
licash-lightning = { workspace = true, features = ["fake"] }
licash-swaps.workspace = true
licash-swaps-service = { path = "../swaps" }
libc = "0.2"
axum.workspace = true
nostr-sdk = { version = "0.45.6", features = ["local-relay"] }
rqrr = { version = "0.11", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["sync"] }

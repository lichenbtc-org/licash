[package]
name = "licash-mobile"
description = "The Licash wallet of the mobile apps, bound to Kotlin and Swift with UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "licash_mobile"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-wallet.workspace = true
licash-store.workspace = true
# The holder's side only: the phone brings its own chain.
licash-contracts = { path = "../../contracts", default-features = false }
licash-nostr = { workspace = true, features = ["tor", "wallet"] }
licash-tor.workspace = true
licash-transport = { workspace = true, features = ["tor"] }
anyhow.workspace = true
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
bip39 = "2.2"
chacha20poly1305 = "0.10"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.40", features = ["bundled", "limits"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27"
thiserror = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi = "0.32.2"

[dev-dependencies]
licash-bridge = { path = "../../bridge" }
licash-contracts = { path = "../../contracts", default-features = false, features = ["testing"] }
licash-chain-client.workspace = true
licash-hub.workspace = true
licash-hub-service = { path = "../../hub", features = ["fake"] }
licash-lightning = { workspace = true, features = ["fake"] }
licash-onchain.workspace = true
licash-swaps.workspace = true
licash-swaps-service = { path = "../../swaps" }
axum.workspace = true
nostr-sdk = { version = "0.45.6", features = ["local-relay"] }

[features]
# The binary generating the Kotlin and Swift bindings.
bindgen = ["uniffi/cli"]

[package]
name = "licash-tor"
description = "Tor for Licash applications, through a client of their own (Arti): HTTP(S) to onion services and the clear web, and an onion service of their own"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service", "static-sqlite", "vanguards", "hs-pow-full"] }
axum.workspace = true
licash-serve.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
rand_core = { version = "0.6", features = ["getrandom"] }
safelog = "0.10"
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tor-cell = "0.48"
tor-hsservice = "0.48"
tor-proto = "0.48"
tor-rtcompat = { version = "0.48", default-features = false, features = ["tokio", "rustls"] }
tracing.workspace = true
webpki-roots = "1"

[dev-dependencies]
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }

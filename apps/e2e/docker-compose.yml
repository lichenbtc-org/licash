# A regtest ecosystem for the end-to-end tests: Bitcoin Core, two hubs
# taking deposits on Bitcoin (claimed to a fixed address), an outside LND
# node that pays and is paid, a swap provider between the hubs paying and
# paid over Lightning through an LND node of its own (hubs run none), a
# Nostr relay the hubs and the provider announce themselves on, and a
# Gotify server their operators are notified on. `run.sh` brings it up, runs the tests and
# removes it.
# Every port is published on 127.0.0.1 only: the hubs', the provider's and
# the relay's at fixed ports, which wallets keep across restarts and the hubs
# name, LICASH_E2E_HUB1, LICASH_E2E_HUB2, LICASH_E2E_SWAPS and
# LICASH_E2E_RELAY, the rest at ports Docker picks. An Android emulator
# reaches them at the same ports through `adb reverse`.

x-lnd: &lnd
  image: lightninglabs/lnd:v0.21.6-beta@sha256:54b3c87ad0bc3fea3fab8af23ace6421147ea97e6b56bf3911592d7853c185b8
  depends_on:
    bitcoind:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "lncli", "--network=regtest", "getinfo"]
    interval: 2s
    timeout: 5s
    retries: 60
  entrypoint: ["lnd"]
  command:
  - --bitcoin.regtest
  - --bitcoin.node=bitcoind
  - --bitcoind.rpchost=bitcoind:18443
  - --bitcoind.rpcuser=licash
  - --bitcoind.rpcpass=licash
  - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
  - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
  - --noseedbackup
  - --nobootstrap
  - --listen=0.0.0.0:9735
  - --rpclisten=0.0.0.0:10009
  - --restlisten=0.0.0.0:8080

x-hub: &hub
  image: licash-hub:e2e
  build:
    context: ../..
    dockerfile: apps/hub/Dockerfile
    # Regtest uses mock proofs and does not need the production prover.
    target: runtime
  entrypoint: ["sh", "-c"]
  environment:
    LICASH_HUB_CHAIN: http://licash:licash@bitcoind:18443
    LICASH_HUB_NETWORK: regtest
    LICASH_HUB_CHAIN_POLL: "1"
    LICASH_HUB_TWEAKS: "true"
    LICASH_HUB_NOSTR_RELAYS: ws://relay:8080
    # The relay as wallets on this host reach it.
    LICASH_HUB_MAILBOX_RELAYS: ws://127.0.0.1:${LICASH_E2E_RELAY:-38390}
    LICASH_HUB_LOG: json
    RUST_LOG: info

services:
  bitcoind:
    image: bitcoin/bitcoin:30.0
    entrypoint: ["bitcoind"]
    command:
      - -regtest
      - -server
      - -printtoconsole
      # licash:licash, for this throwaway regtest only.
      - -rpcauth=licash:6c69636173682d6532652d73616c7421$$290f05ac8a7eb59151185233acb148039c315f534f56afe953ce22da6df910dd
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -fallbackfee=0.0002
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      # Compact filters for light clients, the app's among them.
      - -blockfilterindex=1
      - -peerblockfilters=1
      - -whitelist=0.0.0.0/0
    ports:
      - "127.0.0.1::18443"
      - "127.0.0.1::18444"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=licash", "-rpcpassword=licash", "getblockchaininfo"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The outside world's Lightning node.
  outside-ln:
    <<: *lnd

  # The swap provider's, with a channel to the outside one.
  swaps-ln:
    <<: *lnd
    volumes:
      - swaps-ln:/root/.lnd

  hub1:
    <<: *hub
    # It opens recovery contracts too, F funded by the miner's wallet,
    # which the harness makes once the stack is up: of terms its holders
    # choose, caps up to 2^21 - 1 sat over up to 1,000 blocks, lending up to
    # 2^21 sat of each, its one-time answers kept in its database alone (no
    # witnesses, as regtest allows). Its locks may last 240 blocks, longer than hub2's
    # 144: the swap provider swaps from here to hub2 only if the lock it
    # takes here outlasts its own at hub2 by hub2's window and the refund
    # request that forces the preimage out of hub2.
    command:
      - >-
        [ -f /data/seed ] || licash-hub init; exec licash-hub run --lock-window 240
        --chain http://licash:licash@bitcoind:18443/wallet/miner --contracts
        --contracts-witnesses none --contracts-max-cap 2097151 --contracts-max-blocks 1000
        --contracts-lend 2097152 --contracts-lend-total 100000000
        --announce-url http://127.0.0.1:${LICASH_E2E_HUB1:-38338} --announce-name hub1
        --name hub1 --notify gotify://gotify/$$(cat /notify/token)
        --deposit-sweep-address bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080
        --deposit-depth 1 --deposit-window 6 --deposit-downtime 2 --deposit-sweep-blocks 6
    ports:
      - "127.0.0.1:${LICASH_E2E_HUB1:-38338}:8338"
    volumes:
      - hub1:/data
      - notify:/notify:ro
    depends_on:
      bitcoind:
        condition: service_healthy
      gotify-app:
        condition: service_completed_successfully
      relay:
        condition: service_started

  # It takes deposits as hub1 does, which stock the swap provider here.
  hub2:
    <<: *hub
    command:
      - >-
        [ -f /data/seed ] || licash-hub init; exec licash-hub run
        --announce-url http://127.0.0.1:${LICASH_E2E_HUB2:-38339} --announce-name hub2
        --name hub2 --notify gotify://gotify/$$(cat /notify/token)
        --deposit-sweep-address bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080
        --deposit-depth 1 --deposit-window 6 --deposit-downtime 2 --deposit-sweep-blocks 6
    ports:
      - "127.0.0.1:${LICASH_E2E_HUB2:-38339}:8338"
    volumes:
      - hub2:/data
      - notify:/notify:ro
    depends_on:
      bitcoind:
        condition: service_healthy
      gotify-app:
        condition: service_completed_successfully
      relay:
        condition: service_started

  # Swaps between the hubs, which it reaches on this network, for 1 + 5000
  # ppm, from hub1 to hub2 alone (from hub2, hub1's window is too long to
  # outlast), payouts on Bitcoin Core's chain, and Lightning invoices paid
  # from its node for 2 + 5000 ppm, its routes ending 80 blocks before the
  # client's lock expires; the tests fund it. No contract protects its
  # notes (the tests open none): unprotected, as only tests run.
  # Use a fixed payout minimum for the wallet scenarios.
  swaps:
    image: licash-swaps:e2e
    build:
      context: ../..
      dockerfile: apps/swaps/Dockerfile
    # Root, to read its LND node's macaroon.
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -f /data/wallet.sqlite ] || licash-swaps init;
        for hub in http://hub1:8338 http://hub2:8338; do
        until licash-wallet add-hub $$hub >/dev/null; do sleep 1; done; done;
        exec licash-swaps run --step 1 --fee-base 1 --fee-ppm 5000 --max 200000
        --chain http://licash:licash@bitcoind:18443 --payout-min 1000 --payout-margin 36
        --payout-fee-share 0
        --nostr-relay ws://relay:8080 --announce-url http://127.0.0.1:${LICASH_E2E_SWAPS:-38340}
        --announce-name swaps --name swaps --notify gotify://gotify/$$(cat /notify/token)
        --no-contracts --lnd https://swaps-ln:8080
        --lnurl-url http://127.0.0.1:${LICASH_E2E_SWAPS:-38340} --receive
    environment:
      LICASH_SWAPS_LND_MACAROON: /lnd/data/chain/bitcoin/regtest/admin.macaroon
      LICASH_SWAPS_LND_CERT: /lnd/tls.cert
      LICASH_SWAPS_LOG: json
      LICASH_SWAPS_NETWORK: regtest
      RUST_LOG: info
    ports:
      - "127.0.0.1:${LICASH_E2E_SWAPS:-38340}:8340"
    volumes:
      - swaps:/data
      - swaps-ln:/lnd:ro
      - notify:/notify:ro
    depends_on:
      bitcoind:
        condition: service_healthy
      swaps-ln:
        condition: service_healthy
      hub1:
        condition: service_healthy
      hub2:
        condition: service_healthy

  # An NWC bridge open to anyone at hub2, paying and paid over Lightning
  # through the swap provider, its accounts' Lightning Addresses at the URL
  # published on the host, which it announces on the relay.
  bridge:
    image: licash-bridge:e2e
    build:
      context: ../..
      dockerfile: apps/bridge/Dockerfile
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -f /data/wallet.sqlite ] || licash-bridge init --network regtest --hub http://hub2:8338;
        exec licash-bridge run --via http://swaps:8340 --relay ws://relay:8080 --open
        --name bridge --interval 1
        --max-balance 100000 --public-url http://127.0.0.1:${LICASH_E2E_BRIDGE:-38341} --announce
    environment:
      RUST_LOG: info
    ports:
      - "127.0.0.1:${LICASH_E2E_BRIDGE:-38341}:8090"
    volumes:
      - bridge:/data
    depends_on:
      hub2:
        condition: service_healthy
      swaps:
        condition: service_healthy
      relay:
        condition: service_started

  # An NWC bridge for its owner alone at hub1, whom its pairing code
  # registers, paying and paid through the swap provider, its Lightning
  # Addresses at the URL published on the host: the app's, which tops it up
  # in notes at hub1 and exports its notes.
  bridge2:
    image: licash-bridge:e2e
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -f /data/wallet.sqlite ] || licash-bridge init --network regtest --hub http://hub1:8338;
        exec licash-bridge run --via http://swaps:8340 --relay ws://relay:8080 --name bridge2
        --interval 1
        --public-url http://127.0.0.1:${LICASH_E2E_BRIDGE2:-38342}
    environment:
      RUST_LOG: info
    ports:
      - "127.0.0.1:${LICASH_E2E_BRIDGE2:-38342}:8090"
    volumes:
      - bridge2:/data
    depends_on:
      hub1:
        condition: service_healthy
      swaps:
        condition: service_healthy
      relay:
        condition: service_started

  gotify:
    image: &gotify gotify/server:2.9.1@sha256:a3af47067ce6aad76aadf5ba32d6ddfecd1ae576a961359f039fd1831e8b7652
    environment:
      GOTIFY_DEFAULTUSER_PASS: licash
    ports:
      - "127.0.0.1::80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The operators' Gotify application: its token in /notify/token.
  gotify-app:
    image: *gotify
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -s /notify/token ] || curl -sf -u admin:licash -H 'Content-Type: application/json'
        -d '{"name":"licash"}' http://gotify/application
        | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' > /notify/token;
        test -s /notify/token
    volumes:
      - notify:/notify
    depends_on:
      gotify:
        condition: service_healthy

  relay:
    image: scsibug/nostr-rs-relay:0.10.0@sha256:48d54c2d2781577cf3ed2951112f0953dc2c5e7c9d2ea20c64e8c0fa37d16e4d
    ports:
      - "127.0.0.1:${LICASH_E2E_RELAY:-38390}:8080"

volumes:
  notify:
  hub1:
  hub2:
  swaps:
  bridge:
  bridge2:
  swaps-ln:

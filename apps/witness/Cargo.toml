[package]
name = "licash-witness"
description = "A keyless witness of a Licash hub's one-time contract signatures: it keeps, once and for good, what the hub may sign, and serves it back"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-witness"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
clap.workspace = true
hex = { version = "0.4", features = ["serde"] }
licash-serve.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[package]
name = "licash-serve"
description = "How Licash services serve HTTP: bounded connections, header and body deadlines, load shed, and the source each request comes from"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
licash-api.workspace = true
axum.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
ipnet = "2"
tokio = { workspace = true, features = ["net", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing.workspace = true

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", features = ["util"] }

[package]
name = "licash-bridge"
description = "A Licash wallet that pays and takes Lightning payments for Nostr Wallet Connect clients, out of accounts it keeps"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-bridge"
path = "src/main.rs"

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-nostr.workspace = true
licash-store.workspace = true
licash-wallet.workspace = true
licash-serve.workspace = true
licash-tor.workspace = true
licash-transport = { workspace = true, features = ["tor"] }
anyhow.workspace = true
axum.workspace = true
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
clap.workspace = true
hex = "0.4"
lightning-invoice = { version = "0.34", features = ["std"] }
nostr = { version = "0.45.7", default-features = false, features = ["std", "os-rng", "nip47"] }
nostr-sdk = "0.45.6"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
licash-hub.workspace = true
licash-hub-service = { path = "../hub", features = ["fake"] }
licash-swaps.workspace = true
licash-swaps-service = { path = "../swaps" }
http-body-util = "0.1"
nostr-sdk = { version = "0.45.6", features = ["local-relay"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[package]
name = "licash-observatory"
description = "A Licash observatory: the hubs and swap providers of a network, found on Nostr, watched over Tor, measured with a small balance moved between them, and shown on a web page"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-observatory"
path = "src/main.rs"

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-chain-client.workspace = true
licash-nostr = { workspace = true, features = ["tor"] }
licash-tor.workspace = true
licash-transport = { workspace = true, features = ["tor"] }
licash-wallet.workspace = true
anyhow.workspace = true
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
axum.workspace = true
clap.workspace = true
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing.workspace = true
tracing-subscriber.workspace = true
webpki-roots = "1"

[dev-dependencies]
nostr-sdk = { version = "0.45.6", features = ["local-relay"] }
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }

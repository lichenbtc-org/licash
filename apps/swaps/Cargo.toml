[package]
name = "licash-swaps-service"
description = "The Licash swap provider service: a provider behind its HTTP API, its notifications and its announcement"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-swaps"
path = "src/main.rs"

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-chain-client.workspace = true
licash-contracts = { path = "../contracts" }
licash-dashboard.workspace = true
licash-lightning.workspace = true
licash-nostr = { workspace = true, features = ["tor", "wallet"] }
licash-notify.workspace = true
licash-store.workspace = true
licash-swaps.workspace = true
licash-serve.workspace = true
licash-tor.workspace = true
licash-transport = { workspace = true, features = ["tor"] }
licash-wallet.workspace = true
anyhow.workspace = true
axum.workspace = true
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
clap.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
licash-dashboard = { workspace = true, features = ["test-support"] }
licash-lightning = { workspace = true, features = ["fake"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
